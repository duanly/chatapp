<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
    <radialGradient id="headShine" cx="35%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#AED581"/>
      <stop offset="100%" style="stop-color:#689F38"/>
    </radialGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63"/>
      <stop offset="100%" style="stop-color:#6D4C41"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>

  <!-- 西蓝花茎 -->
  <path d="M72 110 Q72 140 90 145 Q108 140 108 110 L108 95 L72 95 Z" fill="url(#stem)"/>
  <path d="M80 115 Q80 135 90 138 Q100 135 100 115 Z" fill="#A1887F" opacity="0.5"/>

  <!-- 西蓝花头部（多个圆形组成花球） -->
  <!-- 底层大花球 -->
  <circle cx="90" cy="75" r="45" fill="url(#headShine)"/>
  <circle cx="60" cy="80" r="28" fill="#7CB342"/>
  <circle cx="120" cy="80" r="28" fill="#7CB342"/>
  <circle cx="75" cy="55" r="25" fill="#8BC34A"/>
  <circle cx="105" cy="55" r="25" fill="#8BC34A"/>
  <circle cx="90" cy="45" r="22" fill="#9CCC65"/>

  <!-- 中层花球细节 -->
  <circle cx="55" cy="95" r="18" fill="#689F38"/>
  <circle cx="125" cy="95" r="18" fill="#689F38"/>
  <circle cx="68" cy="65" r="16" fill="#9CCC65"/>
  <circle cx="112" cy="65" r="16" fill="#9CCC65"/>
  <circle cx="90" cy="52" r="18" fill="#AED581"/>

  <!-- 小花球点缀 -->
  <circle cx="50" cy="75" r="10" fill="#558B2F"/>
  <circle cx="130" cy="75" r="10" fill="#558B2F"/>
  <circle cx="70" cy="42" r="12" fill="#AED581"/>
  <circle cx="110" cy="42" r="12" fill="#AED581"/>
  <circle cx="90" cy="32" r="10" fill="#C5E1A5"/>

  <!-- 眼睛 -->
  <ellipse cx="75" cy="78" rx="8" ry="10" fill="#fff"/>
  <ellipse cx="105" cy="78" rx="8" ry="10" fill="#fff"/>
  <circle cx="77" cy="80" r="5" fill="#212121"/>
  <circle cx="107" cy="80" r="5" fill="#212121"/>
  <circle cx="79" cy="77" r="2" fill="#fff"/>
  <circle cx="109" cy="77" r="2" fill="#fff"/>

  <!-- 笑脸 -->
  <path d="M80 95 Q90 105 100 95" stroke="#212121" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="62" cy="92" rx="7" ry="4" fill="#FF8A80" opacity="0.6"/>
  <ellipse cx="118" cy="92" rx="7" ry="4" fill="#FF8A80" opacity="0.6"/>

  <!-- 高光 -->
  <ellipse cx="65" cy="40" rx="8" ry="5" fill="#fff" opacity="0.4"/>
</svg>
