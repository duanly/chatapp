version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: chatapp
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: chatapp
      DB_PASSWORD: chatapp123
      DB_NAME: chatapp
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change_this_to_a_random_secret_key
      JWT_EXPIRES_IN: 7d
      # OSS 配置（可选，不配置则用本地存储）
      # OSS_REGION: oss-cn-guangzhou
      # OSS_BUCKET: your-bucket
      # OSS_ACCESS_KEY_ID: your-access-key
      # OSS_ACCESS_KEY_SECRET: your-access-secret
      # OSS_DOMAIN: https://cdn.example.com
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - uploads_data:/app/uploads:ro
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  uploads_data:
